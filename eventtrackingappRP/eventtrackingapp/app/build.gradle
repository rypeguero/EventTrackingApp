plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.eventtrackingapp'
    compileSdk 35

    // Use a stable compile/target; 36 is preview and can be flaky.

    defaultConfig {
        applicationId "com.example.eventtrackingapp"

        // Lower this so emulators/devices can run it. 24 is safe.
        minSdk 24

        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Prefer EITHER the version catalog (libs.*) OR explicit coordinates—but not both.
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview

    // Keep CardView explicitly (often not in catalogs by default)
    implementation 'androidx.cardview:cardview:1.0.0'

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
